name: Astro CI

on:
  push:
    branches:
      - "**"
    tags:
      - "V*"
  pull_request:
    branches:
      - main

jobs:
  astro-ci:
    name: Astro build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Astro build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-build
          path: site/dist

      - name: Install Netlify CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g netlify-cli

      - name: Deploy Astro preview (noindex)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "/*" > dist/_headers
          echo "  X-Robots-Tag: noindex, nofollow" >> dist/_headers
          netlify deploy --dir dist --alias astro-preview --message "Astro preview"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Install Netlify CLI (production tag)
        if: startsWith(github.ref, 'refs/tags/V')
        run: npm install -g netlify-cli

      - name: Deploy Astro to Netlify (production)
        if: startsWith(github.ref, 'refs/tags/V')
        run: netlify deploy --prod --dir dist --site $NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
